name: Assessment da org (onboarding do cliente)

# O diagnóstico que antecede a primeira demanda: o que existe na org do cliente,
# o que está fora de boa prática, e o que recomendar. Roda no onboarding — o
# Squad OS dispara sozinho quando a conexão de dev é confirmada — e pode ser
# repetido quando a org mudar muito.
#
# **Read-only.** Nada aqui altera a org: o agente é instruído a não escrever, a
# lista de ferramentas em assessment.py não inclui `sf_deploy`, e guard-prod.sh
# continua valendo. A primeira camada é instrução, a segunda é mecânica.
#
# Sempre contra a org de **dev** (`<cliente>-dev`): é onde a esteira trabalha, e
# é a org cuja saúde determina o que a esteira vai encontrar pela frente.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Nome do cliente (= clients/<client>/ e prefixo do GitHub Environment)'
        required: true
        default: acxya

permissions:
  contents: write
  pull-requests: write

jobs:
  assessment:
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }}-dev
    env:
      CLIENT: ${{ inputs.client }}
      TARGET_ORG: sbx-${{ inputs.client }}-dev
      ASSESSMENT_BRANCH: assessment/${{ inputs.client }}
    steps:
      - name: Marcar início (observabilidade)
        id: inicio
        run: echo "em=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Salesforce CLI e Claude Code CLI
        run: npm install -g @salesforce/cli @anthropic-ai/claude-code

      - name: Instalar dependências Python
        run: pip install -e .

      - name: Autenticar Salesforce via JWT
        run: |
          if [ -z "${{ secrets.SF_CLIENT_ID }}" ]; then
            echo "::error::O GitHub Environment '${{ inputs.client }}-dev' não tem SF_CLIENT_ID/SF_USERNAME/SF_JWT_KEY. Ver docs/conexoes-e-setup.md."
            exit 1
          fi
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          CLIENT_ID="$(printf '%s' "${{ secrets.SF_CLIENT_ID }}" | tr -d '[:space:]')"
          USERNAME="$(printf '%s' "${{ secrets.SF_USERNAME }}" | tr -d '[:space:]')"
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias "$TARGET_ORG"
          rm -f server.key

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Guardrail #4: nada é commitado direto numa branch protegida. O
      # assessment é substituído a cada rodada — por isso a branch nasce
      # SEMPRE do checkout fresco de `main` acima (HEAD), nunca do próprio tip
      # remoto antigo. `checkout -B` sem start-point reseta pro HEAD atual.
      #
      # Achado real (2026-10-02): a versão anterior fazia
      # `checkout -B "$ASSESSMENT_BRANCH" "origin/$ASSESSMENT_BRANCH"` quando a
      # branch já existia — isso descartava o checkout de `main` e voltava pra
      # foto antiga de quando a branch nasceu. `assessment/mais-polimeros`
      # partiu e commitou em cima de um `main` de antes de SOMOSAGILITY-2
      # existir; o PR resultante **deletava** a demanda de outro cliente —
      # guardrail #7 violado sem ninguém escrever uma linha de código ruim,
      # só porque a branch "reusada" não começava de onde devia.
      - name: Preparar branch do assessment
        run: git checkout -B "$ASSESSMENT_BRANCH"

      # Se o agente não produzir assessment.json válido, o comando falha e o job
      # fica vermelho — é o mesmo princípio do ArtifactAusenteError nas demandas:
      # melhor falhar alto que gravar "saúde: undefined" no perfil do cliente.
      - name: Rodar o assessment
        id: assess
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: sfagents cliente assessment --client "$CLIENT" --target-org "$TARGET_ORG" --github-output

      # --force-with-lease porque a branch agora SEMPRE reparte de `main`
      # fresco (passo acima): se já existia um assessment anterior nela, o
      # histórico diverge do que está no remoto de propósito — é a mesma
      # branch sendo substituída, não uma reescrita de trabalho alheio.
      # `assessment/<cliente>` nunca recebe commit humano por cima: só este
      # job escreve nela, então não há o que perder com o force.
      - name: Commit e push
        run: |
          git add "clients/$CLIENT"
          if [ -d logs ]; then git add logs/; fi
          git commit -m "$CLIENT: assessment da org (saúde ${{ steps.assess.outputs.saude }})" --allow-empty -q
          git push --force-with-lease origin "HEAD:$ASSESSMENT_BRANCH"

      - name: Abrir PR do assessment (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr view "$ASSESSMENT_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$ASSESSMENT_BRANCH" \
              --title "$CLIENT: assessment da org" \
              --body "Aberto automaticamente por \`run-assessment.yml\`. Diagnóstico read-only da org \`$TARGET_ORG\` — **nada foi alterado na org**. Saúde: **${{ steps.assess.outputs.saude }}**, ${{ steps.assess.outputs.recomendacoes }} recomendações (${{ steps.assess.outputs.altas }} de severidade alta). Revise \`clients/$CLIENT/assessment.md\` antes do merge." \
              || echo "::warning::Não consegui abrir o PR automaticamente. A branch $ASSESSMENT_BRANCH já está no ar."
          fi

      # O resumo vai pro perfil do cliente no Squad OS. O relatório longo fica no
      # git; o app mostra o veredito e as recomendações que cabem num card.
      #
      # `if: always()` e não `if: success()`: até 2026-09-13 a falha não voltava
      # pra lugar nenhum. O primeiro assessment de uma org real morreu sem
      # produzir artefato e o perfil do cliente seguiu dizendo "ainda não
      # avaliada" — o mesmo texto de quem nunca tentou. Job vermelho que o app
      # não enxerga é job que só existe pra quem abre o Actions, e a esteira
      # inteira existe pra ninguém precisar abrir o Actions.
      - name: Sincronizar o assessment com o Squad OS
        if: always()
        env:
          SYNC_URL: ${{ secrets.SQUAD_OS_SYNC_ASSESSMENT_URL }}
          SYNC_TOKEN: ${{ secrets.SQUAD_OS_SYNC_TOKEN }}
          RESULTADO: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::SQUAD_OS_SYNC_ASSESSMENT_URL/SQUAD_OS_SYNC_TOKEN não configurados — o assessment não aparece no perfil do cliente. Ver docs/conexoes-e-setup.md."
            exit 0
          fi

          if [ "$RESULTADO" = "success" ]; then
            # `assessment-json` já falhou antes daqui se o arquivo não presta,
            # então neste ramo ele é confiável; só acrescenta de onde veio.
            CORPO="$(sfagents cliente assessment-json --client "$CLIENT" \
              | jq -c --arg u "$RUN_URL" '. + {runUrl: $u}')"
          else
            CORPO="$(jq -nc --arg c "$CLIENT" --arg u "$RUN_URL" \
              '{client: $c, status: "erro", runUrl: $u,
                erro: "o job do assessment falhou antes de produzir um resultado válido — o log do run diz em qual passo"}')"
          fi

          printf '%s' "$CORPO" | curl -fsS -X POST "$SYNC_URL" \
                -H "Authorization: Bearer $SYNC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @- \
            || echo "::warning::Falha ao reportar o resultado pro Squad OS."

      # Observabilidade (council de 2026-10-01) — espelho histórico separado
      # do sync acima, nunca decide nada sobre o perfil do cliente.
      - name: Registrar execução (observabilidade)
        if: always()
        env:
          EXEC_URL: ${{ secrets.SQUAD_OS_SYNC_EXECUCAO_URL }}
          SYNC_TOKEN: ${{ secrets.SQUAD_OS_SYNC_TOKEN }}
          RESULTADO: ${{ job.status }}
        run: |
          if [ -z "$EXEC_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            exit 0
          fi
          jq -nc \
            --arg c "$CLIENT" --arg r "$RESULTADO" \
            --arg inicio "${{ steps.inicio.outputs.em }}" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{client: $c, origem: "assessment", etapa: "org-assessment",
              resultado: $r, iniciadoEm: $inicio, runUrl: $run}' \
            | curl -fsS -X POST "$EXEC_URL" \
                -H "Authorization: Bearer $SYNC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @- \
            || echo "::warning::Falha ao registrar a execução pra observabilidade."
