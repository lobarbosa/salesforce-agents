name: Testar conexão JWT com a sandbox

# Smoke test: confirma que o JWT bearer flow autentica contra a sandbox de um
# cliente. Não faz deploy nem toca em metadata.
#
# Deixou de ser só manual: o Squad OS dispara este workflow quando alguém clica
# em "testar conexão" no cliente, e o resultado volta pra lá por
# /api/sync/conexao. É esse retorno que marca a org como conectada — e, na org
# de **dev**, acende o assessment de onboarding, que é a primeira atividade de
# um cliente novo.
#
# Credenciais vêm do GitHub Environment `<cliente>-<ambiente>` (Settings →
# Environments → acxya-dev → secrets: SF_CLIENT_ID, SF_USERNAME, SF_JWT_KEY).
# Um Environment por cliente POR ambiente: isolamento de credencial por
# cliente e por org, sem duplicar workflow. A esteira só conhece dev e qa —
# produção não tem Environment aqui de propósito (guardrail #1).

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Nome do cliente (= nome do diretório em clients/ e prefixo do GitHub Environment)'
        required: true
        default: acxya
      ambiente:
        description: 'Qual sandbox testar'
        required: true
        type: choice
        default: dev
        options: [dev, qa]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }}-${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Autenticar via JWT
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          # Remove espaço/quebra de linha acidental — client-id e username nunca
          # deveriam ter, mas colar do navegador pode grudar um caractere invisível.
          CLIENT_ID="$(printf '%s' "${{ secrets.SF_CLIENT_ID }}" | tr -d '[:space:]')"
          USERNAME="$(printf '%s' "${{ secrets.SF_USERNAME }}" | tr -d '[:space:]')"
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias "sbx-${{ inputs.client }}-${{ inputs.ambiente }}"

      - name: Confirmar org conectada
        run: sf org display --target-org "sbx-${{ inputs.client }}-${{ inputs.ambiente }}" --json

      - name: Limpar credencial
        if: always()
        run: rm -f server.key

      # `if: always()` e status derivado de job.status: um teste que falhou é
      # informação tão útil quanto um que passou — sem isso a org ficaria
      # eternamente em "aguardando_teste" no app quando a credencial estiver
      # errada, que é exatamente quando alguém precisa saber.
      - name: Reportar o resultado pro Squad OS
        if: always()
        env:
          SYNC_URL: ${{ secrets.SQUAD_OS_SYNC_CONEXAO_URL }}
          SYNC_TOKEN: ${{ secrets.SQUAD_OS_SYNC_TOKEN }}
          RESULTADO: ${{ job.status }}
        run: |
          if [ -z "$SYNC_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::SQUAD_OS_SYNC_CONEXAO_URL/SQUAD_OS_SYNC_TOKEN não configurados — o resultado não volta pro app. Ver docs/conexoes-e-setup.md."
            exit 0
          fi
          if [ "$RESULTADO" = "success" ]; then STATUS=conectado; else STATUS=erro; fi
          jq -nc \
            --arg c "${{ inputs.client }}" \
            --arg a "${{ inputs.ambiente }}" \
            --arg s "$STATUS" \
            '{client: $c, ambiente: $a, status: $s}' \
            | curl -fsS -X POST "$SYNC_URL" \
                -H "Authorization: Bearer $SYNC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @- \
            || echo "::warning::Falha ao reportar o resultado pro Squad OS."
