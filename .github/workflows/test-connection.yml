name: Testar conexão JWT com a sandbox

# Smoke test manual: só confirma que o JWT bearer flow autentica contra a
# sandbox de um cliente. Não faz deploy nem toca em metadata. Rode isso antes
# de confiar em qualquer outro workflow que dependa da mesma credencial.
#
# Credenciais vêm do GitHub Environment com o mesmo nome do cliente
# (Settings → Environments → <client> → secrets: SF_CLIENT_ID, SF_USERNAME,
# SF_JWT_KEY). Um Environment por cliente = isolamento de credencial por
# cliente, sem duplicar workflow.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Nome do cliente (= nome do diretório em clients/ e do GitHub Environment)'
        required: true
        default: acxya

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Autenticar via JWT
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          # Remove espaço/quebra de linha acidental — client-id e username nunca
          # deveriam ter, mas colar do navegador pode grudar um caractere invisível.
          CLIENT_ID="$(printf '%s' "${{ secrets.SF_CLIENT_ID }}" | tr -d '[:space:]')"
          USERNAME="$(printf '%s' "${{ secrets.SF_USERNAME }}" | tr -d '[:space:]')"
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias "sbx-${{ inputs.client }}"

      - name: Confirmar org conectada
        run: sf org display --target-org "sbx-${{ inputs.client }}" --json

      - name: Limpar credencial
        if: always()
        run: rm -f server.key
