name: Baseline — Retrieve metadata

# Traz o metadata existente da sandbox de um cliente para o repo, em fases
# (dados/código primeiro, segurança por último — Profile só traz permissão do
# que já está no repo). Cada fase vira um commit separado. Roda manualmente;
# não é acionado por push/PR porque só faz sentido rodar de novo quando
# quisermos re-sincronizar o baseline, não a cada mudança de código.
#
# Credenciais vêm do GitHub Environment `<cliente>-<ambiente>`. O baseline sai
# por padrão de dev, que é onde a esteira constrói — puxar de QA traria também
# o que ainda está em homologação e não foi aceito.

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Nome do cliente (= clients/<client>/ e prefixo do GitHub Environment)'
        required: true
        default: acxya
      ambiente:
        description: 'De qual sandbox puxar o baseline'
        required: true
        type: choice
        default: dev
        options: [dev, qa]

permissions:
  contents: write
  pull-requests: write

env:
  CLIENT_DIR: clients/${{ inputs.client }}
  TARGET_ORG: sbx-${{ inputs.client }}-${{ inputs.ambiente }}
  BASELINE_BRANCH: baseline/${{ inputs.client }}

jobs:
  retrieve:
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }}-${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Instalar Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Autenticar via JWT
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          # Remove espaço/quebra de linha acidental — client-id e username nunca
          # deveriam ter (achado real: um dos secrets veio com "NOME_VAR=" colado
          # na frente do valor, ver test-connection.yml).
          CLIENT_ID="$(printf '%s' "${{ secrets.SF_CLIENT_ID }}" | tr -d '[:space:]')"
          USERNAME="$(printf '%s' "${{ secrets.SF_USERNAME }}" | tr -d '[:space:]')"
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias "$TARGET_ORG"
          rm -f server.key

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # CLAUDE.md guardrail #4: nada é commitado direto numa branch protegida.
      - name: Preparar branch do baseline
        run: |
          if git fetch origin "$BASELINE_BRANCH" 2>/dev/null; then
            git checkout -B "$BASELINE_BRANCH" "origin/$BASELINE_BRANCH"
          else
            git checkout -b "$BASELINE_BRANCH"
          fi

      - name: "Fase 1 — núcleo (dados e código)"
        run: |
          ( cd "$CLIENT_DIR" && sf project retrieve start --manifest manifest/package-01-core.xml --target-org "$TARGET_ORG" --wait 30 )
          git add "$CLIENT_DIR"
          git commit -m "${{ inputs.client }}: baseline fase 1 - núcleo (dados e código)" --allow-empty -q

      - name: "Fase 2 — automação e regras"
        run: |
          ( cd "$CLIENT_DIR" && sf project retrieve start --manifest manifest/package-02-automacao.xml --target-org "$TARGET_ORG" --wait 30 )
          git add "$CLIENT_DIR"
          git commit -m "${{ inputs.client }}: baseline fase 2 - automação e regras" --allow-empty -q

      - name: "Fase 3 — segurança (depende das fases 1 e 2)"
        run: |
          ( cd "$CLIENT_DIR" && sf project retrieve start --manifest manifest/package-03-seguranca.xml --target-org "$TARGET_ORG" --wait 30 )
          git add "$CLIENT_DIR"
          git commit -m "${{ inputs.client }}: baseline fase 3 - segurança" --allow-empty -q

      - name: "Fase 4 — interface e o resto"
        run: |
          ( cd "$CLIENT_DIR" && sf project retrieve start --manifest manifest/package-04-ui.xml --target-org "$TARGET_ORG" --wait 30 )
          git add "$CLIENT_DIR"
          git commit -m "${{ inputs.client }}: baseline fase 4 - interface" --allow-empty -q

      - name: Inventário
        run: |
          cd "$CLIENT_DIR"
          echo "arquivos: $(find force-app -type f | wc -l)"
          for t in objects classes triggers flows permissionsets layouts; do
            n=$(find force-app -type d -name "$t" -exec sh -c 'ls -1 "$1" | wc -l' _ {} \; 2>/dev/null | paste -sd+ | bc 2>/dev/null)
            echo "$t: ${n:-0}"
          done

      - name: Push
        run: git push origin "HEAD:$BASELINE_BRANCH"

      # Não fatal — ver mesmo comentário em run-demand.yml.
      - name: Abrir PR do baseline (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr view "$BASELINE_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BASELINE_BRANCH" \
              --title "${{ inputs.client }}: baseline retrieve" \
              --body "Aberto automaticamente por \`baseline-retrieve.yml\`. Sincroniza \`$CLIENT_DIR\` com o metadata atual da sandbox, em 4 fases. Revise antes de aprovar." \
              || echo "::warning::Não consegui abrir o PR automaticamente (permissão do GITHUB_TOKEN?). A branch $BASELINE_BRANCH já está no ar — abra o PR manualmente."
          fi
