name: Rodar demanda (agentes)

# Aciona o orquestrador de verdade (Claude Agent SDK + .claude/agents) para uma
# demanda de um cliente. Diferente do smoke test e do baseline retrieve (que só
# rodam sf CLI puro), este workflow precisa autenticar com a Anthropic também,
# porque aqui não existe a sessão de Claude Code já logada que esta conversa tem.
#
# Dois jobs, e não um: um job do Actions declara UM `environment:` só, e a
# esteira agora atravessa dois (build em dev, teste/homologação/release na
# sandbox de QA). Então `decidir` — que não abre environment nenhum e por isso
# não vê secret nenhum — lê o status.yaml da demanda e diz qual ambiente a
# etapa atual precisa; `rodar` abre exatamente esse. A regra de qual etapa vai
# pra onde mora em src/salesforce_agents/ambientes.py, não aqui: repetida em
# YAML ela sairia de sincronia com a CLI na primeira mudança.
#
# ANTHROPIC_API_KEY é secret de repositório (compartilhada entre clientes — a
# conta Anthropic é do squad, não do cliente). As credenciais Salesforce vêm do
# GitHub Environment `<cliente>-<ambiente>` (ex.: acxya-dev, acxya-qa).

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Nome do cliente (= clients/<client>/ e prefixo do GitHub Environment)'
        required: true
        default: acxya
      demand_id:
        description: 'ID da demanda (ex.: ACXYA-1)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      etapa: ${{ steps.amb.outputs.etapa }}
      ambiente: ${{ steps.amb.outputs.ambiente }}
      org_alias: ${{ steps.amb.outputs.org_alias }}
      github_environment: ${{ steps.amb.outputs.github_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Só click e pyyaml: `sfagents demanda ambiente` não importa o
      # orquestrador (o import de orchestrator é tardio, ver cli.py), então
      # este job não precisa instalar o Claude Agent SDK nem a CLI Salesforce
      # pra responder uma pergunta que é leitura de um arquivo.
      - name: Instalar o mínimo pra ler a demanda
        run: pip install click pyyaml

      - name: Descobrir o ambiente da etapa atual
        id: amb
        env:
          PYTHONPATH: src
        run: |
          python3 -m salesforce_agents.cli demanda ambiente \
            --client "${{ inputs.client }}" "${{ inputs.demand_id }}" \
            | tee -a "$GITHUB_OUTPUT"

  rodar:
    needs: decidir
    runs-on: ubuntu-latest
    environment: ${{ needs.decidir.outputs.github_environment }}
    env:
      CLIENT: ${{ inputs.client }}
      TARGET_ORG: ${{ needs.decidir.outputs.org_alias }}
      AMBIENTE: ${{ needs.decidir.outputs.ambiente }}
      DEMAND_BRANCH: feature/${{ inputs.demand_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anunciar org alvo
        run: |
          echo "::notice::Etapa '${{ needs.decidir.outputs.etapa }}' roda no ambiente '$AMBIENTE' (org $TARGET_ORG, secrets de ${{ needs.decidir.outputs.github_environment }})."

      - name: Instalar Salesforce CLI e Claude Code CLI
        run: npm install -g @salesforce/cli @anthropic-ai/claude-code

      - name: Instalar dependências Python
        run: pip install -e .

      - name: Autenticar Salesforce via JWT
        run: |
          if [ -z "${{ secrets.SF_CLIENT_ID }}" ]; then
            echo "::error::O GitHub Environment '${{ needs.decidir.outputs.github_environment }}' não tem SF_CLIENT_ID/SF_USERNAME/SF_JWT_KEY. Cadastre os secrets desse ambiente (ver docs/conexoes-e-setup.md) — cada ambiente tem o seu, dev e qa não compartilham credencial."
            exit 1
          fi
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          # Remove espaço/quebra de linha acidental — client-id e username nunca
          # deveriam ter (achado real: um dos secrets veio com "NOME_VAR=" colado
          # na frente do valor, ver test-connection.yml).
          CLIENT_ID="$(printf '%s' "${{ secrets.SF_CLIENT_ID }}" | tr -d '[:space:]')"
          USERNAME="$(printf '%s' "${{ secrets.SF_USERNAME }}" | tr -d '[:space:]')"
          sf org login jwt \
            --client-id "$CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias "$TARGET_ORG"
          rm -f server.key

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # CLAUDE.md guardrail #4: nada é commitado direto numa branch protegida.
      # Toda demanda vive numa branch dedicada feature/<DEMAND-ID> — se ela já
      # existe (uma etapa anterior já rodou), continua dali; senão, nasce da
      # branch que disparou o workflow.
      - name: Preparar branch da demanda
        run: |
          if git fetch origin "$DEMAND_BRANCH" 2>/dev/null; then
            git checkout -B "$DEMAND_BRANCH" "origin/$DEMAND_BRANCH"
          else
            git checkout -b "$DEMAND_BRANCH"
          fi

      - name: Rodar orquestrador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEMAND_ID: ${{ inputs.demand_id }}
        run: |
          python3 -c "
          import os
          from salesforce_agents import demands
          from salesforce_agents.orchestrator import run_sync
          client = os.environ['CLIENT']
          demand_id = os.environ['DEMAND_ID']
          etapa = demands.Demand.load(client, demand_id).status
          run_sync(client, demand_id, etapa)
          "

      - name: Commit e push dos artefatos gerados
        env:
          DEMAND_ID: ${{ inputs.demand_id }}
        run: |
          git add "clients/$CLIENT"
          # logs/custos_agentes.csv (telemetria de custo, src/salesforce_agents/costs.py)
          # — só existe se pelo menos uma sessão de agente terminou (ResultMessage
          # recebido); sem o "if", git add falha em runner limpo e derruba o commit
          # dos artefatos junto.
          if [ -d logs ]; then git add logs/; fi
          git commit -m "$DEMAND_ID: sessão de agente via CI ($AMBIENTE)" --allow-empty -q
          git push origin "HEAD:$DEMAND_BRANCH"

      # Não fatal: o que importa (artefatos da demanda) já está empurrado pra
      # $DEMAND_BRANCH no passo anterior. Se o GITHUB_TOKEN não tiver permissão
      # pra abrir PR (Settings → Actions → General → Workflow permissions →
      # "Allow GitHub Actions to create and approve pull requests"), cai aqui
      # sem derrubar o job inteiro — alguém abre o PR manualmente.
      - name: Abrir PR da demanda (se ainda não existir)
        env:
          GH_TOKEN: ${{ github.token }}
          DEMAND_ID: ${{ inputs.demand_id }}
        run: |
          if ! gh pr view "$DEMAND_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$DEMAND_BRANCH" \
              --title "$DEMAND_ID: acompanhamento da demanda" \
              --body "Aberto automaticamente por \`run-demand.yml\`. Acumula os artefatos de cada etapa da demanda **$DEMAND_ID** (\`clients/$CLIENT/demandas/$DEMAND_ID/\`). Merge só depois dos gates humanos bloqueantes da doutrina (\`CLAUDE.md\`) — revise \`gates.md\` antes de aprovar." \
              || echo "::warning::Não consegui abrir o PR automaticamente (permissão do GITHUB_TOKEN?). A branch $DEMAND_BRANCH já está no ar — abra o PR manualmente."
          fi
